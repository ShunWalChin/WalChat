# Dependência local: Supabase é iniciado separadamente pela CLI.
services:
  redis:
    image: redis:7.4-alpine
    container_name: wal-chat-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - '6380:6379'
    volumes:
      - wal_chat_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  wal_chat_redis:
