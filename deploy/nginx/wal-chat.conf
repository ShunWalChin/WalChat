# Chaves vazias não são contabilizadas pelo limit_req_zone. Cada rota usa a
# menor cota compatível com o fluxo real, sem limitar bursts assinados da Meta.
map $uri $wal_general_limit_key {
    default $binary_remote_addr;
    /api/public/webhooks/instagram "";
    /api/public/webhooks/whatsapp "";
}

map $uri $wal_webhook_limit_key {
    default "";
    /api/public/webhooks/instagram $binary_remote_addr;
    /api/public/webhooks/whatsapp $binary_remote_addr;
}

map $uri $wal_message_limit_key {
    default "";
    /api/messages/send $binary_remote_addr;
    /api/ai/suggest $binary_remote_addr;
}

map $uri $wal_oauth_limit_key {
    default "";
    /api/integrations/meta/start $binary_remote_addr;
}

limit_req_zone $wal_general_limit_key zone=wal_general:10m rate=30r/s;
limit_req_zone $wal_webhook_limit_key zone=wal_webhook:10m rate=120r/s;
limit_req_zone $wal_message_limit_key zone=wal_message:10m rate=5r/s;
limit_req_zone $wal_oauth_limit_key zone=wal_oauth:10m rate=10r/m;

# O gateway Supabase publica /auth/v1 na internet. Sem cota, login e recuperacao
# de senha ficam abertos a credential stuffing na borda.
map $uri $wal_supabase_auth_limit_key {
    default "";
    ~^/auth/v1/(token|signup|recover|otp|verify|magiclink) $binary_remote_addr;
}

limit_req_zone $binary_remote_addr zone=wal_supabase:10m rate=30r/s;
limit_req_zone $wal_supabase_auth_limit_key zone=wal_supabase_auth:10m rate=12r/m;

# HTTP existe apenas para redirecionar à origem canônica HTTPS. O certificado
# é compartilhado pelos dois hosts e renovado pelo Certbot.
server {
    listen 80;
    listen [::]:80;
    server_name wal-chat.64.181.178.125.nip.io;
    server_tokens off;
    return 301 https://$host$request_uri;
}

# Entrada pública da aplicação; o processo Node permanece preso ao loopback.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wal-chat.64.181.178.125.nip.io;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/wal-chat.64.181.178.125.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wal-chat.64.181.178.125.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;
    limit_req_status 429;
    error_page 429 = @wal_rate_limited;

    location = /api/public/webhooks/instagram {
        client_max_body_size 1m;
        limit_req zone=wal_webhook burst=240 nodelay;
        proxy_pass http://127.0.0.1:4194;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Nenhuma CDN participa deste caminho. Repassar estes headers deixaria
        # o cliente escolher a propria chave de rate limit da aplicacao.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Fastly-Client-IP "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 20s;
    }

    location = /api/public/webhooks/whatsapp {
        client_max_body_size 1m;
        limit_req zone=wal_webhook burst=240 nodelay;
        proxy_pass http://127.0.0.1:4194;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Nenhuma CDN participa deste caminho. Repassar estes headers deixaria
        # o cliente escolher a propria chave de rate limit da aplicacao.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Fastly-Client-IP "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 20s;
    }

    location = /api/data-deletion {
        client_max_body_size 64k;
        limit_req zone=wal_general burst=20 nodelay;
        proxy_pass http://127.0.0.1:4194;
        proxy_set_header Host $host;
        # Nenhuma CDN participa deste caminho. Repassar estes headers deixaria
        # o cliente escolher a propria chave de rate limit da aplicacao.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Fastly-Client-IP "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 20s;
    }

    location / {
        limit_req zone=wal_general burst=60 nodelay;
        limit_req zone=wal_message burst=10 nodelay;
        limit_req zone=wal_oauth burst=5 nodelay;

        proxy_pass http://127.0.0.1:4194;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Nenhuma CDN participa deste caminho. Repassar estes headers deixaria
        # o cliente escolher a propria chave de rate limit da aplicacao.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Fastly-Client-IP "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 70s;
    }

    location @wal_rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error":"Limite temporário excedido.","code":"rate_limited"}';
    }
}

