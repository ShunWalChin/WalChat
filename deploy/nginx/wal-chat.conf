# Entrada pública da aplicação; o processo Node permanece preso ao loopback.
server {
    listen 80;
    listen [::]:80;
    server_name wal-chat.64.181.178.125.nip.io;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:4194;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

# A API Supabase usa host separado para preservar URLs Auth/REST corretas.
server {
    listen 80;
    listen [::]:80;
    server_name api-wal-chat.64.181.178.125.nip.io;

    client_max_body_size 55m;

    location / {
        proxy_pass http://127.0.0.1:54351;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
